name: Windows validation and release

on:
  push:
    branches: [main]
    paths: ['releases/v*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nikke-trace-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Windows PowerShell regression checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in Get-ChildItem tests/Test-*.ps1 | Sort-Object Name) {
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($test.Name)" }
          }

      - name: Build the single-file player archive
        shell: powershell
        run: |
          $before = (Get-FileHash -LiteralPath NikkeTrace.cmd -Algorithm SHA256).Hash
          python build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          if ((Get-FileHash -LiteralPath NikkeTrace.cmd -Algorithm SHA256).Hash -ne $before) { throw 'Generated launcher differs from the reviewed source.' }

      - name: Publish the validated release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath NikkeTrace.ps1 -Raw
          $match = [regex]::Match($source, 'VERSION (\d+\.\d+)')
          if (-not $match.Success) { throw 'Version not found.' }
          $tag = 'v' + $match.Groups[1].Value
          $notes = "releases/$tag.md"
          $archive = "dist/nikke-trace-$tag.zip"
          if (-not (Test-Path -LiteralPath $notes) -or -not (Test-Path -LiteralPath $archive)) { throw 'Release files missing.' }
          $body = Get-Content -LiteralPath $notes -Raw
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $body += "`n`nSHA-256 ($archive):`n$hash`n"
          $bodyPath = Join-Path $env:RUNNER_TEMP 'nikke-trace-release.md'
          [IO.File]::WriteAllText($bodyPath, $body, [Text.UTF8Encoding]::new($false))
          gh release create $tag $archive --target $env:GITHUB_SHA --title "NikkeTrace $tag" --notes-file $bodyPath --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; no existing release was overwritten.' }
